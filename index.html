<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PBOS - Personal Business Operating System"
    />
    <title>PBOS</title>

    <!-- Styles -->
    <link rel="stylesheet" href="app/presentation/styles/base.css" />
    <link rel="stylesheet" href="app/presentation/styles/theme.css" />
    <link rel="stylesheet" href="app/presentation/styles/layout.css" />
    <link rel="stylesheet" href="app/presentation/styles/components.css" />
    <link rel="stylesheet" href="app/presentation/styles/screens.css" />
  </head>
  <body>
    <!-- App Root -->
    <div id="app">
      <!-- Navigation -->
      <nav id="main-nav" class="main-nav" aria-label="Main navigation">
        <div class="nav-brand">
          <span class="logo">PBOS</span>
        </div>
        <ul class="nav-links" role="menubar">
          <li role="none">
            <a href="#today" role="menuitem" data-route="today">Today</a>
          </li>
          <li role="none">
            <a href="#habits" role="menuitem" data-route="habits">Habits</a>
          </li>
          <li role="none">
            <a href="#projects" role="menuitem" data-route="projects"
              >Projects</a
            >
          </li>
          <li role="none">
            <a href="#mindmap" role="menuitem" data-route="mindmap">Mind Map</a>
          </li>
          <li role="none">
            <a href="#insights" role="menuitem" data-route="insights"
              >Insights</a
            >
          </li>
        </ul>
        <button
          id="nav-toggle"
          class="nav-toggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
        >
          <span></span><span></span><span></span>
        </button>
      </nav>

      <!-- Main Content Area -->
      <main id="main-content" class="main-content">
        <div id="screen-container" class="screen-container">
          <div class="loading-state" id="initial-loading">
            <p>Loading PBOS...</p>
          </div>
        </div>
      </main>

      <!-- Global Modal Container -->
      <div
        id="modal-container"
        class="modal-container"
        aria-hidden="true"
        role="dialog"
        aria-modal="true"
      >
        <div class="modal-backdrop"></div>
        <div class="modal-content" id="modal-content"></div>
      </div>

      <!-- Toast / Notification Container -->
      <div
        id="toast-container"
        class="toast-container"
        aria-live="polite"
        aria-atomic="true"
      ></div>
    </div>

    <!-- App Bootstrap -->
    <script type="module" src="app/presentation/index.js"></script>
  </body>
</html>
